[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./donors.json" }]
# The diagnostic reserve scanner is not part of a production transaction.
gas_limit = 1000000000
code_size_limit = 100000
